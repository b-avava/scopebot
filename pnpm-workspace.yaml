packages:
  - apps/*
  - packages/*

# Only version checks, not needed to run.
allowBuilds:
  "@whiskeysockets/baileys": false
  protobufjs: false

# All Effect packages are released in lockstep and must stay on the same version.
catalog:
  "@biomejs/biome": 2.6.5
  "@anthropic-ai/sdk": ^1.4.0
  "@effect/platform-node": 4.1.2
  "@effect/sql-pg": 4.1.2
  "@effect/vitest": 4.1.2
  "@fontsource-variable/google-sans": ^5.3.2
  "@tailwindcss/vite": ^4.3.4
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0
  "@vitejs/plugin-react": ^6.2.1
  "@whiskeysockets/baileys": 7.0.0-rc14
  clsx: ^2.1.1
  "@types/node": ^24.0.0
  effect: 4.1.2
  electron: ^45.2.2
  electron-vite: ^6.0.0
  lucide-react: ^1.67.0
  motion: ^14.9.0
  qrcode: ^1.5.4
  "@types/qrcode": ^1.5.6
  react: ^19.3.1
  react-dom: ^19.3.1
  react-markdown: ^10.1.0
  remark-gfm: ^4.0.1
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.4
  typescript: ^7.0.2
  vite: ^8.3.5
  vitest: ^5.1.0

minimumReleaseAgeExclude:
  - electron@45.2.2
  - lucide-react@1.67.0
  - "@biomejs/biome@2.6.5"
  - "@biomejs/cli-android-arm64@2.6.5"
  - "@biomejs/cli-android-x64@2.6.5"
  - "@biomejs/cli-darwin-arm64@2.6.5"
  - "@biomejs/cli-darwin-x64@2.6.5"
  - "@biomejs/cli-linux-arm64-musl@2.6.5"
  - "@biomejs/cli-linux-arm64@2.6.5"
  - "@biomejs/cli-linux-x64-musl@2.6.5"
  - "@biomejs/cli-linux-x64@2.6.5"
  - "@biomejs/cli-win32-arm64@2.6.5"
  - "@biomejs/cli-win32-x64@2.6.5"
