name: CI

on:
  pull_request:
  push:
    branches: [main]

# The default token can only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # These names are required status checks in .github/rulesets/protect-main.json.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            run: pnpm exec biome ci --error-on-warnings --reporter=github .
          - name: Typecheck
            run: pnpm typecheck
          - name: Test
            run: pnpm test
          - name: Build
            run: pnpm build
    steps:
      # Actions are pinned to a commit, because a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: ${{ matrix.run }}
