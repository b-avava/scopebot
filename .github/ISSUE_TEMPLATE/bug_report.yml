name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A security problem goes to a private report instead: see SECURITY.md.
        Do not paste API keys, passwords, tokens or real client data. Replace them with placeholders.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0, or the commit hash
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Server
        - Web interface
        - Desktop app
        - WhatsApp
        - Telegram
        - Instagram
        - AI employee (answers, tools, approvals)
        - Installation or update
        - Other
  - type: input
    id: setup
    attributes:
      label: Setup
      description: How you run Scope Bot, the OS, and the model provider.
      placeholder: Docker Compose on Ubuntu 24.04, Anthropic API
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server output around the error helps most.
      render: text
